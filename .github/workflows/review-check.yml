name: Review workflow check

on:
  pull_request:
    paths:
      - 'docs/review/**'
  push:
    branches:
      - main
    paths:
      - 'docs/review/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate docs/review directories
        run: python .github/scripts/validate-review-dirs.py
