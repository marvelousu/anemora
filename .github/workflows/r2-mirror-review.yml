name: r2-mirror-review

# Mirrors review/devlog imagery from git to Cloudflare R2 on Linux (no Windows
# MAX_PATH limit, parallel upload via rclone). Two uses:
#   - workflow_dispatch: one-time backfill of existing imagery for the active
#     work/* branches (run this BEFORE the Phase D history purge).
#   - push to work/**: keep R2 in sync while imagery still lives in git.
# After Phase D removes imagery from git, ongoing NEW cycles are uploaded
# directly to R2 by tools/r2/r2-upload-review.ps1 (the AI loop), not this action.
#
# Layout in the bucket (lifecycle expires tree/ after 45 days; manifests/ never):
#   tree/<slug>/docs/review/<...>            (full path preserved)
#   tree/<slug>/docs/devlog/screenshots/<...>
#   manifests/<slug>.json                    (JSON array of "docs/..." paths)
#
# Requires repo secrets: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# (an R2 "Object Read & Write" S3 API token for account fefd0ce0171bfcedbfc4e244876be220).

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "space-separated work/* branches (empty = all active within 30 days)"
        required: false
        default: ""
  push:
    branches: ['work/**']
    paths:
      - 'docs/review/**'
      - 'docs/devlog/screenshots/**'

concurrency:
  group: r2-mirror-review
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      BUCKET: anemora-review
      R2_ENDPOINT: https://fefd0ce0171bfcedbfc4e244876be220.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone jq

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secrets are not set"; exit 1
          fi
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          EOF

      - name: Resolve branch list
        id: br
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            list="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.branches }}" ]; then
            list="${{ github.event.inputs.branches }}"
          else
            cutoff=$(( $(date +%s) - 30*86400 ))
            list=$(git for-each-ref --format='%(refname:short) %(committerdate:unix)' refs/remotes/origin/work \
              | awk -v c="$cutoff" '$2>=c{ sub(/^origin\//,"",$1); print $1 }' | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "branches: $list"

      - name: Mirror each branch to R2
        run: |
          set -euo pipefail
          [ -n "${{ steps.br.outputs.list }}" ] || { echo "no branches to mirror"; exit 0; }
          for b in ${{ steps.br.outputs.list }}; do
            ref="origin/$b"
            git rev-parse --verify "$ref" >/dev/null 2>&1 || ref="$b"
            slug=$(printf '%s' "$b" | sed -E 's,^work/,,; s,[^a-zA-Z0-9._-]+,-,g; s,^-+,,; s,-+$,,')
            echo "=== $b (slug=$slug) ==="
            work=$(mktemp -d)
            if git archive "$ref" -- docs/review docs/devlog/screenshots 2>/dev/null | tar -x -C "$work" 2>/dev/null && [ -d "$work/docs" ]; then
              count=$(find "$work/docs" -type f | wc -l)
              echo "  $count files; syncing to r2:$BUCKET/tree/$slug/docs"
              rclone copy "$work/docs" "r2:$BUCKET/tree/$slug/docs" \
                --transfers 32 --checkers 32 --s3-no-check-bucket --fast-list
              ( cd "$work" && find docs -type f | sort | jq -R -s 'split("\n")|map(select(length>0))' ) > "$work/manifest.json"
              rclone copyto "$work/manifest.json" "r2:$BUCKET/manifests/$slug.json" --s3-no-check-bucket
              echo "  wrote manifests/$slug.json"
            else
              echo "  no review/devlog imagery on $b (skip)"
            fi
            rm -rf "$work"
          done
